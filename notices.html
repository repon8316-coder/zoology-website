a();try{var q=matchMedia("(prefers-color-scheme: dark)");if(q.addEventListener)q.addEventListener("change",function(){a()});else if(q.addListener)q.addListener(function(){a()});addEventListener("storage",function(){a()})}catch(e){}
window.SiteTheme={apply:a,get:g}})();
</script>
